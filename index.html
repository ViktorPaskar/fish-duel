<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Fish Duel</title>
<meta name="description" content="Рыбалка в GTA VI на двоих: улов, вес, карта Леониды и табло онлайн.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fish Duel">
<link rel="icon" type="image/png" href="assets/icon-64.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#000;--g1:#1c1c1e;--g2:#2c2c2e;--g3:#3a3a3c;
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.55);
  --l1:#fff;--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);
  --tint:#ff2d78;--me:#ff2d78;--op:#40c8e0;--gold:#ffcc00;--red:#ff453a;--orange:#ff9f0a;
  --meG:linear-gradient(135deg,#ff2d78,#ff9f0a);--opG:linear-gradient(135deg,#40c8e0,#5e5ce6);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --spring:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
#bigmap,#pickmap{touch-action:none}
body{background:var(--bg);color:var(--l1);font:17px/1.3 var(--sans);letter-spacing:-.022em;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hidden{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* ---------- nav bar ---------- */
.nb{position:fixed;z-index:40;top:0;left:0;right:0;padding-top:var(--st);transition:background .25s,border-color .25s;border-bottom:.5px solid transparent}
.nb.solid{background:rgba(22,22,24,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nb.always{background:rgba(18,18,20,.95)}
.nb .in{max-width:620px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.nb .ct{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap}
.nb.solid .ct,.nb.always .ct{opacity:1}
.nb .r{justify-self:end;display:flex;gap:8px}
.cbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--tint)}
.cbtn svg{width:17px;height:17px;stroke-width:2.6}
.cbtn.big{width:36px;height:36px}
.cbtn.big svg{width:19px;height:19px}

/* ---------- pages ---------- */
.page{padding-top:calc(44px + var(--st));padding-bottom:calc(49px + var(--sb) + 28px)}
.lt{font-size:34px;font-weight:700;letter-spacing:.012em;line-height:1.2;margin:4px 0 2px}
.sub{font-size:15px;color:var(--l2);margin-bottom:16px}
.sub b{font-weight:600;color:var(--l1)}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:32px;padding:2px;border-radius:9px;background:var(--fill)}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .3s var(--spring)}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;color:var(--l1)}
.seg button[aria-pressed="true"]{font-weight:600}

/* grouped lists */
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:.019em;margin:28px 4px 8px}
.gh small{font-size:15px;font-weight:400;color:var(--l2);letter-spacing:-.01em}
.gh.s{font-size:15px;font-weight:600;color:var(--l2);margin:22px 16px 7px;letter-spacing:-.01em}
.gf{font-size:13px;color:var(--l2);margin:7px 16px 0;line-height:1.38;letter-spacing:-.005em}
.group{background:var(--g1);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ind+.row.ind::before,.row.ind::before{left:64px}
button.row:active,a.row:active{background:var(--g2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t em{display:block;font-style:normal;font-size:13px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .v{color:var(--l2);font-size:17px;white-space:nowrap}
.row .chev{width:8px;height:14px;color:var(--l3);stroke-width:2.6}
.row.red{color:var(--red)}
.row.tint{color:var(--tint)}

/* ---------- competition card ---------- */
.comp{position:relative;margin-top:16px;border-radius:22px;background:var(--g1);padding:18px 0 16px;overflow:hidden}
.comp .cols{display:grid;grid-template-columns:1fr 1fr}
.comp .col{padding:0 18px;min-width:0}
.comp .col+.col{border-left:.5px solid var(--sep)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-weight:700;font-size:15px;color:#fff;flex:none}
.av.me{background:var(--meG)} .av.op{background:var(--opG)}
.av.sm{width:30px;height:30px;font-size:13px}
.av.ph{background-size:cover;background-position:center;color:transparent}
.av.ph.me{box-shadow:0 0 0 2px var(--g1),0 0 0 4px var(--me)} .av.ph.op{box-shadow:0 0 0 2px var(--g1),0 0 0 4px var(--op)}
.avbtn{display:grid;justify-items:center;gap:8px;margin:26px 0 0;color:var(--tint);font-size:15px}
.avbtn .av{width:80px;height:80px;font-size:32px}
.avbtn .av:not(.ph){background:var(--g2);color:var(--l2)}
.who span{font-size:15px;font-weight:600;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{margin-top:14px;font-family:var(--round);font-weight:700;font-size:clamp(36px,11vw,48px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.42em;font-weight:600;color:var(--l2);margin-left:4px}
.col.me .big{color:var(--me)} .col.op .big{color:var(--op)}
.col.dim .big{opacity:.45}
.spn{margin-top:6px;font-size:13px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadpill{display:inline-flex;align-items:center;gap:4px;height:22px;margin-top:10px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;color:#000}
.col.me .leadpill{background:var(--me)} .col.op .leadpill{background:var(--op)}
.leadpill svg{width:12px;height:12px;stroke-width:2.6}
.comp .foot{margin:16px 18px 0}
.track{display:flex;gap:3px;height:6px;border-radius:3px;overflow:hidden;background:var(--fill2)}
.track i{height:100%;border-radius:3px;transition:flex-grow .8s var(--spring)}
.track .me{background:var(--meG)} .track .op{background:var(--opG)}
.comp .foot p{margin-top:10px;font-size:15px;color:var(--l2)}
.comp .foot p b{color:var(--l1);font-weight:600}
.invite{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.invite .av{background:transparent;border:1.5px dashed var(--l3);color:var(--l3)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:15px;background:var(--fill);color:var(--tint);font-size:15px;font-weight:600}
.pbtn svg{width:15px;height:15px;stroke-width:2.4}
.comp.pop{animation:pop .7s var(--spring)}
@keyframes pop{35%{transform:scale(1.02)}}

/* tips */
.tip{position:relative;display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 44px 14px 14px;border-radius:16px;background:var(--g1)}
.tip .ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,45,120,.18);color:var(--tint);flex:none}
.tip .ic svg{width:17px;height:17px;stroke-width:2.2}
.tip .t{flex:1;min-width:0}
.tip b{display:block;font-size:15px;font-weight:600}
.tip p{margin-top:2px;font-size:13px;color:var(--l2);line-height:1.38}
.tip .pbtn{margin-top:10px}
.x2{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--l3)}
.x2 svg{width:15px;height:15px;stroke-width:2.4}
/* v2 */
.mebtn{justify-self:start;position:relative;display:grid;place-items:center;width:40px;height:40px;margin-left:-4px}
.mebtn .av{width:32px;height:32px;font-size:13px}
.mebtn .badge{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.avw{position:relative;display:inline-grid;flex:none}
.sd{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--g1);background:#8e8e93}
.sd.online{background:#30d158}
.ico{display:grid;place-items:center;width:29px;height:29px;border-radius:7px;flex:none;color:#fff}
.ico svg{width:17px;height:17px;stroke-width:2.1}
.ico.c1{background:#ff2d78}.ico.c2{background:#0a84ff}.ico.c3{background:#30d158}.ico.c4{background:#ff9f0a}.ico.c5{background:#5e5ce6}
.ico.gray{background:var(--g3)}.ico.red{background:var(--red)}.ico.gold{background:linear-gradient(135deg,#ffd60a,#ff9f0a);color:#000}
.ico.lg{width:64px;height:64px;border-radius:16px}.ico.lg svg{width:36px;height:36px}
.row.ii+.row.ii::before{left:57px}
.av.xs{width:24px;height:24px;font-size:11px}
.av.xs.ph.me,.av.xs.ph.op{box-shadow:0 0 0 1.5px var(--g1),0 0 0 3px currentColor}
.av.xs.ph.me{color:var(--me)}.av.xs.ph.op{color:var(--op)}
.done{display:flex;gap:6px}
.dscore{display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 16px 4px}
.dscore b{font-family:var(--round);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.dscore .me{color:var(--me)}.dscore .op{color:var(--op)}
.days{display:flex;gap:8px;align-items:flex-end;padding:12px 16px 14px}
.dcol{flex:1;display:grid;justify-items:center;gap:5px}
.dbar{display:block;width:100%;max-width:30px;border-radius:6px;background:var(--fill)}
.dbar.me{background:var(--meG)}.dbar.op{background:var(--opG)}
.dv{font-family:var(--round);font-size:11px;color:var(--l2)}
.dlab{font-size:11px;color:var(--l2)}
.dayh{display:flex;justify-content:space-between;align-items:center}
.dw{display:flex;align-items:center;gap:4px;color:var(--gold)}
.dw svg{width:14px;height:14px;stroke-width:2.2}
.legend{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--l2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}.legend i.me{background:var(--me)}.legend i.op{background:var(--op)}
.prog span{display:block}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.prof{display:grid;justify-items:center;gap:4px;padding:6px 0 10px}
.prof .av{width:88px;height:88px;font-size:34px}
.prof b{margin-top:8px;font-size:22px;font-weight:700}
.prof .link{color:var(--tint);font-size:15px;min-height:36px}
.sph{display:grid;justify-items:center;gap:4px;text-align:center;padding:6px 0 4px}
.sph b{margin-top:10px;font-size:22px;font-weight:700}
.sph em{font-style:normal;font-size:15px;color:var(--l2)}
#spmap{height:230px;border-radius:12px;overflow:hidden;isolation:isolate;background:#41f7d5}
.mapf{position:absolute;z-index:500;left:0;right:0;top:calc(98px + var(--st));display:flex;justify-content:center;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.mapf::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:rgba(28,28,30,.92);color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:#fff;color:#000}
.chip svg{width:14px;height:14px;stroke-width:2.4}
.chip .av.xs{width:20px;height:20px;font-size:10px;box-shadow:none}
.as .grp{max-height:62vh;overflow:auto}
/* all-time tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:14px 14px 15px;border-radius:18px;background:var(--g1);text-align:left}
.tile.rec{background:linear-gradient(160deg,rgba(255,204,0,.18),var(--g1) 62%)}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--l2)}
.ico.sm{width:24px;height:24px;border-radius:6px}.ico.sm svg{width:14px;height:14px}
.tile .bv{margin-top:12px;font-family:var(--round);font-size:30px;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.tile .bv small{font-size:15px;font-weight:600;color:var(--l2);margin-left:3px}
.tile .bs{max-width:100%;margin-top:5px;font-size:13px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .bw{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:10px;font-size:13px;color:var(--l1)}
.tile .bw>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.sm{width:100%;height:5px;margin-top:12px}
.split{display:flex;justify-content:space-between;width:100%;margin-top:6px;font-family:var(--round);font-size:13px;font-weight:600}
.split .me{color:var(--me)}.split .op{color:var(--op)}
.gh.s small{float:right;font-weight:400;color:var(--l2)}
/* stat rows */
.sr .t b{font-size:17px}
.sr .vals{display:flex;gap:4px}
.sr .vals span{width:74px;text-align:right;font-family:var(--round);font-size:17px;font-variant-numeric:tabular-nums;color:var(--l3)}
.sr .vals span.w{font-weight:600}
.sr .vals .me.w{color:var(--me)} .sr .vals .op.w{color:var(--op)}
.colhead{display:flex;justify-content:flex-end;gap:4px;padding:0 16px 6px}
.colhead span{width:74px;text-align:right;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .me{color:var(--me)} .colhead .op{color:var(--op)}

/* log */
.lw{text-align:right;white-space:nowrap}
.lw b{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-family:var(--round);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.lw b svg{width:15px;height:15px;color:var(--gold);fill:var(--gold);stroke-width:1.5}
.lw b small{font-size:13px;font-weight:600;color:var(--l2);margin-left:-1px}
.lw em{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-style:normal;font-size:13px;color:var(--l2);margin-top:1px}
.lw em svg{width:13px;height:13px;color:var(--tint);stroke-width:2.2}

/* species */
.prog{display:flex;align-items:center;gap:16px;padding:16px;border-radius:22px;background:var(--g1);margin-bottom:12px}
.prog svg.ring{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.prog b{display:block;font-family:var(--round);font-size:28px;font-weight:700;line-height:1.1}
.prog span{font-size:15px;color:var(--l2)}
.search{position:relative;margin:4px 0 0}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--l2)}
.search input{width:100%;height:36px;padding:0 10px 0 32px;border-radius:10px;background:var(--fill);border:0;outline:none;font-size:17px}
.search input::placeholder{color:var(--l2)}
.dots{display:flex;gap:4px;width:20px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.dots i.me{background:var(--me)} .dots i.op{background:var(--op)}
.bests{display:grid;gap:1px;text-align:right;font-family:var(--round);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bests .me{color:var(--me)} .bests .op{color:var(--op)} .bests .no{color:var(--l3)}

/* empty */
.empty{display:grid;justify-items:center;text-align:center;padding:52px 24px}
.empty svg{width:52px;height:52px;color:var(--l3);stroke-width:1.5}
.empty h3{margin-top:14px;font-size:22px;font-weight:700;letter-spacing:.017em}
.empty p{margin-top:6px;font-size:15px;color:var(--l2)}
.empty .pbtn{margin-top:18px;height:36px;padding:0 16px;border-radius:18px;font-size:17px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;z-index:40;left:0;right:0;bottom:0;padding-bottom:var(--sb);background:rgba(22,22,24,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar .in{max-width:620px;margin:0 auto;height:49px;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:grid;justify-items:center;align-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.01em;color:#8e8e93}
.tabbar button svg{width:25px;height:25px;stroke-width:1.8}
.tabbar button[aria-current="page"]{color:var(--tint)}

/* ---------- map page ---------- */
#p-map{position:fixed;inset:0;padding:0;background:#41f7d5}
#bigmap{position:absolute;z-index:0;left:0;right:0;top:calc(44px + var(--st));bottom:calc(49px + var(--sb))}
.mapseg{position:absolute;z-index:500;left:50%;top:calc(56px + var(--st));transform:translateX(-50%);width:min(320px,calc(100% - 32px));background:rgba(28,28,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:9px}
.zoom{position:absolute;z-index:500;right:12px;bottom:calc(49px + var(--sb) + 14px);display:grid;border-radius:10px;overflow:hidden;background:rgba(28,28,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.zoom button{display:grid;place-items:center;width:44px;height:44px;color:var(--l1)}
.zoom button+button{border-top:.5px solid var(--sep)}
.zoom svg{width:19px;height:19px}
.leaflet-container{background:#41f7d5;font:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.75)!important;font-size:10px!important;border-radius:6px 0 0 0;padding:1px 6px!important}
.leaflet-popup-content-wrapper{background:rgba(30,30,32,.94);backdrop-filter:blur(20px);color:var(--l1);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.leaflet-popup-tip{background:rgba(30,30,32,.94)}
.leaflet-popup-content{margin:12px 14px;font-size:15px;line-height:1.35;letter-spacing:-.01em}
.leaflet-popup-content .pt{font-weight:600;font-size:17px}
.leaflet-popup-content .pw{font-family:var(--round);font-weight:700;font-size:22px;margin:2px 0}
.leaflet-popup-content .ps{color:var(--l2);font-size:13px}
.leaflet-container a.leaflet-popup-close-button{display:none}
.leaflet-popup-content .pbtn{height:34px;border-radius:17px;background:var(--tint);color:#fff}
.mk{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);color:#fff}
.mk::after{content:"";position:absolute;left:50%;bottom:-7px;width:2.5px;height:6px;margin-left:-1.25px;background:#fff;border-radius:2px}
.mk.me{background:var(--meG)} .mk.op{background:var(--opG)}
.mk.ph{background-size:cover!important;background-position:center!important}
.mk.ph.me{border-color:var(--me)} .mk.ph.op{border-color:var(--op)}
.mk svg{width:17px;height:17px;stroke-width:2.2}
.mk.best{width:40px;height:40px}
.mk.best::before{content:"";position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #fff}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;height:calc(100% - var(--st) - 12px);background:var(--g1);border-radius:12px 12px 0 0;overflow:hidden;transform:translateY(105%);transition:transform .45s var(--spring);display:flex;flex-direction:column}
.sheet.open{transform:none}
@media(min-width:700px){.sheet{bottom:50%;height:min(760px,90vh);border-radius:14px;transform:translateY(150%)}.sheet.open{transform:translateY(50%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--g3);margin:6px auto 0;flex:none}
.panes{position:relative;flex:1;overflow:hidden}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--g1);transition:transform .4s var(--spring)}
.pane.right{transform:translateX(100%)}
.pane.left{transform:translateX(-28%)}
.snb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 16px;flex:none}
.snb h2{font-size:17px;font-weight:600;white-space:nowrap}
.snb .l{justify-self:start;display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;min-height:44px}
.snb .l svg{width:12px;height:20px;stroke-width:2.6;margin-left:-4px}
.snb .r{justify-self:end;color:var(--tint);font-size:17px;font-weight:600;min-height:44px}
.snb .r:disabled{color:var(--l3);cursor:default}
.sbody{flex:1;overflow:auto;padding:4px 16px calc(24px + var(--sb));overscroll-behavior:contain}
.sbody .group{background:var(--g2)}
.sbody .row+.row::before{background:rgba(84,84,88,.65)}
.sbody button.row:active{background:var(--g3)}
.wbox{padding:20px 16px 16px;display:grid;justify-items:center;gap:14px}
.wfield{display:flex;align-items:baseline;justify-content:center;gap:6px;width:100%}
.wfield input{width:3em;max-width:260px;padding:0;border:0;outline:none;background:none;text-align:right;font-family:var(--round);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;caret-color:var(--tint);-moz-appearance:textfield}
.wfield input::placeholder{color:var(--l3)}
.wfield .u{font-family:var(--round);font-weight:600;font-size:26px;color:var(--l2);flex:none}
.wfield.lb input{text-align:center}
.wfield.lb .u{margin-right:8px}
.wfield.lb .u:last-child{margin-right:0}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.wbox .seg{width:180px}
.tf{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px;color:var(--l1)}
.tf::placeholder{color:var(--l3)}
.check{width:20px;height:20px;color:var(--tint);stroke-width:2.6}

/* picker */
.picker{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .45s var(--spring)}
.picker.open{transform:none}
.pk-h{flex:none;padding-top:var(--st);background:#121214;border-bottom:.5px solid var(--sep)}
.pk-h .in{max-width:620px;margin:0 auto;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.pk-h .ct{font-weight:600;font-size:17px;white-space:nowrap}
.pk-h .l,.pk-h .r{display:flex;align-items:center;height:44px;color:var(--tint);font-size:17px}
.pk-h .l{justify-self:start}
.pk-h .r{justify-self:end;font-weight:600}
.pk-map{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;background:#41f7d5}
#pickmap{position:absolute;inset:0;z-index:0}
.pk-f{flex:none;padding:12px 16px calc(12px + var(--sb));background:#121214;border-top:.5px solid var(--sep)}
.pk-f .fbtn{max-width:588px;margin:0 auto}
.cross{position:absolute;z-index:550;left:50%;top:50%;width:40px;height:40px;margin:-48px 0 0 -20px;pointer-events:none;transition:transform .2s}
.cross .mk{width:40px;height:40px;background:var(--meG)}
.cross .mk svg{width:20px;height:20px}
.picker.drag .cross{transform:translateY(-10px)}
.cross::after{content:"";position:absolute;left:50%;bottom:-12px;width:8px;height:4px;margin-left:-4px;border-radius:50%;background:rgba(0,0,0,.35)}

/* action sheet & alert */
.as{position:fixed;z-index:90;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;padding:0 8px calc(8px + var(--sb));transform:translateY(110%);transition:transform .4s var(--spring)}
.as.open{transform:none}
.as .grp{border-radius:14px;overflow:hidden;background:rgba(40,40,42,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.as .ttl{padding:14px 16px;text-align:center;font-size:13px;color:var(--l2);border-bottom:.5px solid var(--sep)}
.as .ttl b{display:block;font-weight:600;color:var(--l2)}
.as button{display:block;width:100%;height:57px;font-size:20px;color:#0a84ff;letter-spacing:.02em}
.as .grp button+button{border-top:.5px solid var(--sep)}
.as button.red{color:var(--red)}
.as .cancel{margin-top:8px;border-radius:14px;background:var(--g1);font-weight:600}
.alert{position:fixed;z-index:95;left:50%;top:50%;width:270px;transform:translate(-50%,-50%) scale(1.1);opacity:0;pointer-events:none;transition:transform .25s var(--spring),opacity .2s;border-radius:14px;overflow:hidden;background:rgba(40,40,42,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);text-align:center}
.alert.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.alert .bd{padding:19px 16px 15px}
.alert h4{font-size:17px;font-weight:600}
.alert p{font-size:13px;margin-top:3px;color:var(--l1)}
.alert input{width:100%;height:30px;margin-top:14px;padding:0 7px;border-radius:7px;border:.5px solid var(--sep);background:var(--g1);outline:none;font-size:16px}
.alert .acts{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert .acts button{height:44px;font-size:17px;color:#0a84ff}
.alert .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.alert .acts button.red{color:var(--red)}

/* toast */
.toast{position:fixed;z-index:100;left:50%;top:calc(8px + var(--st));display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 18px 10px 12px;border-radius:24px;background:rgba(44,44,46,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:15px;font-weight:600;transform:translate(-50%,-150%);transition:transform .5s var(--spring)}
.toast.show{transform:translate(-50%,0)}
.toast .ic.ph{background-size:cover;background-position:center}
.toast .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--meG);color:#fff;flex:none}
.toast.rec .ic{background:var(--gold);color:#000}
.toast svg{width:17px;height:17px;stroke-width:2.4}

/* ---------- onboarding ---------- */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + var(--st)) 16px calc(32px + var(--sb))}
.onb .logo{margin:0 auto}
.onb h1,.onb .lead{text-align:center}
.logo{display:block;width:132px;height:132px;border-radius:50%;filter:drop-shadow(0 18px 40px rgba(255,45,120,.35))}
.appicon{width:88px;height:88px;border-radius:20px;background:var(--meG);display:grid;place-items:center;box-shadow:0 18px 40px -12px rgba(255,45,120,.6)}
.appicon svg{width:52px;height:52px;color:#fff;fill:#fff;stroke:none}
.onb h1{margin-top:22px;font-size:34px;font-weight:700;letter-spacing:.012em}
.onb .lead{margin-top:6px;font-size:17px;color:var(--l2)}
.onb .group{margin-top:28px}
.fbtn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:14px;background:var(--tint);color:#fff;font-size:17px;font-weight:600}
.fbtn:active{opacity:.8}
.fbtn.gray{background:var(--g1);color:var(--tint)}
.err{min-height:20px;margin:8px 16px 0;font-size:13px;color:var(--red)}
.codein{text-transform:uppercase;letter-spacing:.2em;font-family:var(--round);font-weight:600}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- networking: PeerJS / WebRTC ---------- */
const PFX='fishduel-v1-';
let peer=null,conns=[],isHost=false,gen=0,retryT=null,net='off';
function setNet(s){net=s;if(!S.room)return;if(view==='board')renderBoard();if(s2&&s2.kind==='profile')renderProfile()}
function cleanup(){clearTimeout(retryT);gen++;conns.forEach(c=>{try{c.close()}catch(e){}});conns=[];if(peer){try{peer.destroy()}catch(e){}peer=null}}
function retry(){const g=gen;setNet('connecting');clearTimeout(retryT);retryT=setTimeout(()=>{if(g===gen)join()},2500+Math.random()*1500)}
function join(){
  cleanup();if(!S.room)return;if(typeof Peer==='undefined'){setNet('off');return}
  const g=gen;setNet('connecting');const p=new Peer(PFX+S.room,{debug:0});peer=p;
  p.on('open',()=>{if(g!==gen)return;isHost=true;setNet(conns.length?'online':'waiting')});
  p.on('connection',c=>{if(g===gen)wire(c,g)});
  p.on('disconnected',()=>{if(g===gen&&!p.destroyed){try{p.reconnect()}catch(e){}}});
  p.on('error',e=>{if(g!==gen)return;if(e.type==='unavailable-id'){try{p.destroy()}catch(_){}guest(g)}else if(e.type!=='peer-unavailable')retry()});
}
function guest(g){isHost=false;const p=new Peer({debug:0});peer=p;p.on('open',()=>{if(g!==gen)return;wire(p.connect(PFX+S.room,{reliable:true}),g)});p.on('error',()=>{if(g===gen)retry()})}
function wire(c,g){

  c.on('data',d=>{if(g===gen)onData(d,c)});
  c.on('close',()=>{if(g!==gen)return;conns=conns.filter(x=>x!==c);if(!conns.length){if(isHost)setNet('waiting');else retry()}});
  c.on('error',()=>{});
}
const hello=()=>({t:'hello',noav:S.avatars[S.pid]?[]:[S.pid],names:S.names,avatars:S.avatars,catches:Object.values(S.catches),deleted:Object.keys(S.deleted)});
function send(m,ex){conns.forEach(c=>{if(c!==ex&&c.open){try{c.send(m)}catch(e){}}})}
const n01=v=>v==null||(typeof v==='number'&&v>=0&&v<=1);
function okCatch(c){
  if(!c||typeof c.id!=='string'||c.id.length>=40||typeof c.pid!=='string'||c.pid.length>=40)return false;
  if(typeof c.sp!=='string'||!c.sp.trim()||c.sp.length>40||typeof c.ts!=='number')return false;
  const g=c.g!=null?c.g:(Number.isInteger(c.oz)?Math.round(c.oz*28.3495):null);
  if(!Number.isInteger(g)||g<=0||g>500000)return false;
  if(c.note!=null&&(typeof c.note!=='string'||c.note.length>50))return false;
  if(c.u!=null&&typeof c.u!=='number')return false;
  return n01(c.x)&&n01(c.y);
}
function clean(c){const o={id:c.id,pid:c.pid,sp:normSp(c.sp),g:c.g!=null?c.g:Math.round(c.oz*28.3495),ts:c.ts,note:c.note?String(c.note).trim():''};if(c.x!=null&&c.y!=null){o.x=c.x;o.y=c.y;if(c.m===2)o.m=2;remap(o)}if(typeof c.u==='number')o.u=c.u;return o}
function onData(d,from){

  if(d.t==='hello'){
    if(d.avatars&&typeof d.avatars==='object')for(const[k,v]of Object.entries(d.avatars)){if(k!==S.pid&&avOk(v)&&S.avatars[k]!==v){S.avatars[k]=v;ch=true}}
    if(Array.isArray(d.noav))for(const k of d.noav){if(k!==S.pid&&S.avatars[k]){delete S.avatars[k];ch=true}}
    if(d.names&&typeof d.names==='object')for(const[k,v]of Object.entries(d.names)){if(k!==S.pid&&typeof v==='string'&&v.length<=18&&S.names[k]!==v){S.names[k]=v;ch=true}}
    if(Array.isArray(d.deleted))for(const id of d.deleted){if(typeof id==='string'&&!S.deleted[id]){S.deleted[id]=1;delete S.catches[id];ch=true}}
    if(Array.isArray(d.catches))for(const c of d.catches){if(!okCatch(c)||S.deleted[c.id])continue;const ex=S.catches[c.id];if(!ex||(ex.pid===c.pid&&(c.u||0)>(ex.u||0))){S.catches[c.id]=clean(c);ch=true}}

}

/* ---------- stats ---------- */
function since(){const n=new Date();n.setHours(0,0,0,0);if(period==='today')return+n;if(period==='week'){n.setDate(n.getDate()-(n.getDay()+6)%7);return+n}return 0}
const all=()=>Object.values(S.catches).filter(c=>!S.deleted[c.id]);
const inPeriod=()=>all().filter(c=>c.ts>=since());
function players(){const ids=new Set([S.pid,...Object.keys(S.names),...all().map(c=>c.pid)]);return[S.pid,...[...ids].filter(x=>x!==S.pid)]}
function stats(list){const P={};for(const pid of players())P[pid]={pid,count:0,total:0,best:null,sp:{}};
  for(const c of list){const p=P[c.pid];if(!p)continue;p.count++;p.total+=c.g;if(!p.best||c.g>p.best.g)p.best=c;if(!p.sp[c.sp]||c.g>p.sp[c.sp].g)p.sp[c.sp]=c}return P}
function recordOf(c){const L=all().filter(x=>x.id!==c.id);const room=L.reduce((m,x)=>Math.max(m,x.g),0);
  if(L.length&&c.g>room)return'rec';const own=L.filter(x=>x.pid===c.pid&&x.sp===c.sp);if(own.length&&c.g>Math.max(...own.map(x=>x.g)))return'pb';return null}

function roomRecords(){const L=all().sort((a,b)=>a.ts-b.ts),out=new Set();let room=0;for(const c of L){if(c.g>room&&room>0)out.add(c.id);room=Math.max(room,c.g)}const top=L.reduce((m,c)=>!m||c.g>m.g?c:m,null);if(top)out.add(top.id);return out}
const PL={today:'сегодня',week:'за неделю',all:'за всё время'};

/* ---------- map: official Leonida map, full-resolution tiles ---------- */
const TW=5365,TH=7491,TZ=5;
const toLL=c=>L.CRS.Simple.pointToLatLng(L.point(c.x*TW,(1-c.y)*TH),TZ);
const toXY=ll=>{const p=L.CRS.Simple.latLngToPoint(ll,TZ);return{x:cl01(p.x/TW),y:cl01(1-p.y/TH),m:2}};
const MB=()=>L.latLngBounds(L.CRS.Simple.pointToLatLng(L.point(0,TH),TZ),L.CRS.Simple.pointToLatLng(L.point(TW,0),TZ));
function makeMap(el){
  const m=L.map(el,{crs:L.CRS.Simple,zoomControl:false,zoomSnap:0,zoomDelta:.5,wheelPxPerZoomLevel:110,bounceAtZoomLimits:false});
  L.tileLayer('assets/tiles/{z}/{x}/{y}.webp',{bounds:MB(),minNativeZoom:0,maxNativeZoom:TZ,noWrap:true,keepBuffer:6,updateWhenZooming:false}).addTo(m);
  m.setMaxBounds(MB().pad(.06));m.attributionControl.setPrefix(false).addAttribution('© Rockstar Games');
  fitAll(m);return m;
}
function fitAll(m){m.invalidateSize();m.setMinZoom(-3);m.setMaxZoom(TZ+.6);m.fitBounds(MB(),{animate:false});m.setMinZoom(m.getZoom()-.2)}
let bigmap=null,layer=null,focusId=null;
const mkIcon=(cls,pid)=>{const a=S.avatars[pid];return L.divIcon({className:'',html:a?`<div class="mk ph ${cls}" style="background-image:url('${a}')"></div>`:`<div class="mk ${cls}">${ic('fish')}</div>`,iconSize:cls.includes('best')?[40,40]:[32,32],iconAnchor:cls.includes('best')?[20,47]:[16,39],popupAnchor:[0,-40]})};

function placePins(){
  const w=S.mapWho||'all';layer.clearLayers();const Lc=inPeriod().filter(c=>c.x!=null&&(w==='all'||(w==='me')===(c.pid===S.pid))&&(!S.mapSp||c.sp===S.mapSp)),best=Lc.reduce((m,c)=>!m||c.g>m.g?c:m,null);let target=null;

  if(target){bigmap.setView(target.getLatLng(),Math.min(bigmap.getMaxZoom()-1,bigmap.getMinZoom()+3),{animate:false});target.openPopup();focusId=null}
}

    const c={...S.catches[editId],sp:pick,g,note:$('#noteIn').value.trim().slice(0,50),u:Date.now()};
    if(loc){c.x=+loc.x.toFixed(5);c.y=+loc.y.toFixed(5);c.m=2}else{delete c.x;delete c.y;delete c.m}
    S.catches[c.id]=c;save();send({t:'upd',c});editId=null;closeSheet();render();toast('Изменения сохранены');return}
  const c={id:rid(14),pid:S.pid,sp:pick,g,ts:Date.now(),note:$('#noteIn').value.trim().slice(0,50)};
  if(loc){c.x=+loc.x.toFixed(5);c.y=+loc.y.toFixed(5);c.m=2}
  const r=recordOf(c);S.catches[c.id]=c;save();send({t:'add',c});closeSheet();render();
  toast(r==='rec'?`Рекорд комнаты: ${kgT(g)}`:r==='pb'?`Личный рекорд: ${pick}, ${kgT(g)}`:`${pick}, ${kgT(g)}`,r==='rec');
}

/* ---------- share ---------- */
async function share(){
  const url=location.origin+location.pathname+'#'+S.room;
  try{if(navigator.share){await navigator.share({title:'Fish Duel',text:`Рыбалка в GTA VI. Код комнаты: ${S.room}`,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}catch(e){alertBox({title:'Ссылка на комнату',input:url,ok:'Готово',f:()=>{}})}
}

/* ---------- events ---------- */
function setName(){const n=$('#nameIn').value.trim().slice(0,18);if(!n){$('#setupErr').textContent='Введи имя.';$('#nameIn').focus();return false}S.names[S.pid]=n;return true}
function enter(code){S.room=code;save();history.replaceState(null,'','#'+code);render();join()}
$('#createBtn').onclick=()=>{if(setName())enter(rid(5))};
$('#joinBtn').onclick=()=>{if(!setName())return;const c=$('#codeIn').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==5){$('#setupErr').textContent='В коде 5 символов.';$('#codeIn').focus();return}enter(c)};
$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#joinBtn').click()}});
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();($('#codeIn').value?$('#joinBtn'):$('#createBtn')).click()}});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-share]')){share();return}
  if(t.closest('[data-add]')){openSheet();return}
  const ad=t.closest('[data-addat]');if(ad){const[x,y]=ad.dataset.addat.split(',').map(Number);bigmap.closePopup();openSheet({x,y});return}
  const p=t.closest('[data-seg] button');if(p){period=p.dataset.p;S.period=period;save();render();return}
  const tb=t.closest('.tabbar button');if(tb){if(view===tb.dataset.v){window.scrollTo({top:0,behavior:'smooth'});return}view=tb.dataset.v;S.view=view;save();window.scrollTo(0,0);render();return}
  const a=t.closest('[data-act]');if(a){const c=S.catches[a.dataset.act];if(!c)return;const acts=[];
    if(c.x!=null)acts.push({t:'Показать на карте',f:()=>{focusId=c.id;if(c.ts<since()){period='all';S.period='all'}view='map';S.view=view;save();render()}});
    acts.push({t:'Открыть вид',f:()=>openS2('species',c.sp)});
    if(c.pid===S.pid){acts.push({t:'Изменить',f:()=>openSheet(null,c.id)});acts.push({t:'Удалить запись',red:1,f:()=>{S.deleted[c.id]=1;delete S.catches[c.id];save();send({t:'del',id:c.id});render()}})}actionSheet(c.sp,kgT(c.g)+(c.pid===S.pid?'':`, ${nm(c.pid)}`),acts);return}
  if(t.closest('#renameBtn')){alertBox({title:'Твоё имя',msg:'Его увидит соперник.',input:nm(S.pid),max:18,ok:'Сохранить',f:v=>{v=(v||'').trim().slice(0,18);if(v){S.names[S.pid]=v;save();send(hello());render()}}});return}
  if(t.closest('#leaveBtn')){actionSheet('Выйти из комнаты?','Улов останется на этом устройстве.',[{t:'Выйти',red:1,f:()=>{closeS2();cleanup();S.room=null;save();history.replaceState(null,'',location.pathname);net='off';render()}}]);return}
  const sp=t.closest('[data-sp]');if(sp){pick=sp.dataset.sp;formState();showPane('form');setTimeout(()=>{const i=unit==='kg'?$('#kgIn'):$('#lbIn');if(!readG())i.focus()},380);return}
  const ns=t.closest('[data-newsp]');if(ns){pick=normSp(ns.dataset.newsp).slice(0,40);formState();showPane('form');return}
  const u=t.closest('#unitSeg button');if(u){setUnit(u.dataset.u);return}
  if(t.closest('#meBtn')){openS2('profile');return}
  if(t.closest('[data-recall]')){S.recAll=!S.recAll;save();renderBoard();return}
  const sd=t.closest('[data-spd]');if(sd){openS2('species',sd.dataset.spd);return}
  const mw=t.closest('[data-mw]');if(mw){S.mapWho=mw.dataset.mw;save();renderMap();return}
  if(t.closest('[data-msp]')){const sps=[...new Set(inPeriod().filter(c=>c.x!=null).map(c=>c.sp))].sort();
    actionSheet('Вид на карте','',[{t:'Все виды',f:()=>{S.mapSp=null;save();renderMap()}},...sps.map(x=>({t:x,f:()=>{S.mapSp=x;save();renderMap()}}))]);return}
});
$('#s2Done').onclick=closeS2;$('#ov3').onclick=closeS2;
$('#addBtn').onclick=()=>openSheet();
$('#cancelBtn').onclick=closeSheet;$('#ov').onclick=closeSheet;$('#doneBtn').onclick=saveCatch;
$('#spRow').onclick=()=>showPane('sp');$('#backBtn').onclick=()=>showPane('form');
$('#locRow').onclick=openPicker;
$('#spSearch').addEventListener('input',renderSpList);
['#kgIn','#lbIn','#ozIn'].forEach(s=>$(s).addEventListener('input',formState));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#picker').classList.contains('open'))closePicker();else if($('#sheet').classList.contains('open'))closeSheet();else if(s2)closeS2()});
addEventListener('scroll',()=>{if(view!=='map')$('#nb').classList.toggle('solid',scrollY>36)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.room&&net!=='online'&&net!=='waiting')join()});

/* ---------- avatar ---------- */
function pickAvatar(){const f=$('#avFile');f.value='';f.click()}
$('#avFile').addEventListener('change',async()=>{
  const file=$('#avFile').files[0];if(!file)return;
  try{
    const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();
    const n=192,cv=document.createElement('canvas'),s=Math.min(img.naturalWidth,img.naturalHeight);cv.width=cv.height=n;
    cv.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,n,n);URL.revokeObjectURL(url);
    S.avatars[S.pid]=cv.toDataURL('image/jpeg',.82);save();send(hello());render();renderObAv();
  }catch(e){toast('Не удалось открыть фото')}
});
function renderObAv(){const a=S.avatars[S.pid];$('#obAvPrev').innerHTML=a?avH(S.pid):`<span class="av">${ic('plus')}</span>`;$('#obAvT').textContent=a?'Изменить фото':'Добавить фото'}
$('#obAv').onclick=pickAvatar;
document.addEventListener('click',e=>{
  if(!e.target.closest('#avBtn,#avBtn2'))return;
  if(!S.avatars[S.pid]){pickAvatar();return}
  actionSheet('Твоё фото','',[{t:'Выбрать другое',f:pickAvatar},{t:'Удалить фото',red:1,f:()=>{delete S.avatars[S.pid];save();send(hello());render()}}]);
});
/* stop iOS Safari from pinch-zooming the whole page (the map handles its own pinch) */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
/* if Safari still zooms the page, keep the bars pinned to what is actually visible, at normal size */
function vvFix(){const v=window.visualViewport;if(!v)return;const z=v.scale>1.01,H=document.documentElement.clientHeight;
  document.querySelectorAll('[data-vv]').forEach(el=>{
    if(!z){el.style.transform='';el.style.transformOrigin='';return}
    const top=el.dataset.vv==='top';el.style.transformOrigin=top?'0 0':'0 100%';
    el.style.transform=`translate(${v.offsetLeft}px,${top?v.offsetTop:v.offsetTop+v.height-H}px) scale(${1/v.scale})`})}
if(window.visualViewport){visualViewport.addEventListener('resize',vvFix);visualViewport.addEventListener('scroll',vvFix)}

/* ---------- boot ---------- */
/* ---------- history backup ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-hide]')){S['hide'+e.target.closest('[data-hide]').dataset.hide]=1;save();render();return}
  if(e.target.closest('[data-export]')){
    const data={app:'fish-duel',v:1,exported:new Date().toISOString(),room:S.room,names:S.names,avatars:S.avatars,catches:Object.values(S.catches),deleted:Object.keys(S.deleted)};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`fish-duel-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    S.lastBackup=Date.now();S.lastBackupCount=all().length;save();render();toast('Копия сохранена');return}
  if(e.target.closest('#importBtn')){const f=$('#bkFile');f.value='';f.click()}
});
$('#bkFile').addEventListener('change',async()=>{
  const file=$('#bkFile').files[0];if(!file)return;
  try{
    const d=JSON.parse(await file.text());if(!d||d.app!=='fish-duel'||!Array.isArray(d.catches))throw 0;
    const before=all().length;
    for(const c of d.catches){if(okCatch(c)&&!S.deleted[c.id]&&!S.catches[c.id])S.catches[c.id]=clean(c)}
    if(d.names&&typeof d.names==='object')for(const[k,v]of Object.entries(d.names)){if(typeof v==='string'&&v.length<=18&&!S.names[k])S.names[k]=v}
    if(d.avatars&&typeof d.avatars==='object')for(const[k,v]of Object.entries(d.avatars)){if(avOk(v)&&!S.avatars[k])S.avatars[k]=v}
    save();send(hello());render();const n=all().length-before;toast(n?`Восстановлено записей: ${n}`:'Все записи уже были на месте');
  }catch(err){toast('Это не файл копии Fish Duel')}
});
IDB.get('state').then(d=>{
  if(!d||typeof d!=='object')return;let ch=false;
  if(FRESH&&typeof d.pid==='string'){S.pid=d.pid;if(d.room)S.room=d.room;for(const k of['period','view','unit','lastBackup','lastBackupCount','lastLoc','hideA2HS'])if(d[k]!=null)S[k]=d[k];ch=true}
  if(d.deleted)for(const id of Object.keys(d.deleted))if(!S.deleted[id]){S.deleted[id]=1;delete S.catches[id];ch=true}
  if(d.catches)for(const c of Object.values(d.catches))if(okCatch(c)&&!S.deleted[c.id]&&!S.catches[c.id]){S.catches[c.id]=clean(c);ch=true}
  for(const k of['names','avatars'])if(d[k]&&typeof d[k]==='object')for(const[a,v]of Object.entries(d[k]))if(!S[k][a]){S[k][a]=v;ch=true}
  if(ch){save();render();if(S.room&&FRESH)join();else send(hello())}
}).catch(()=>{});
renderObAv();
const hash=(location.hash||'').slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');
if(S.names[S.pid])$('#nameIn').value=S.names[S.pid];
if(hash.length===5&&hash!==S.room){if(S.room){cleanup();S.room=null}$('#codeIn').value=hash}
save();render();if(S.room)join();
let day=new Date().toDateString();
setInterval(()=>{const d=new Date().toDateString();if(d!==day){day=d;render()}},60000);
})();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fish Duel</title>
<meta name="description" content="Рыболовная дуэль для двоих в GTA VI: вес, виды, карта Леониды и таблица лидеров онлайн.">
<meta name="theme-color" content="#130a24">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ff3d8b'/><stop offset='1' stop-color='%23ffb04d'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M8 16c2.4-3.6 5.2-5 8.6-5 2.6 0 4.6 1.6 6.8 5-2.2 3.4-4.2 5-6.8 5-3.4 0-6.2-1.4-8.6-5z' fill='%23130a24'/><path d='M8 16 4 12.5v7z' fill='%23130a24'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --night:#130a24; --night2:#1a0e31; --card:#22143d; --card2:#2d1b4f; --raise:#3a2563;
  --line:rgba(255,226,244,.09); --line2:rgba(255,226,244,.16);
  --text:#fff3f8; --mute:#bca9d6; --dim:#806c9e;
  --pink:#ff3d8b; --coral:#ff6a5c; --orange:#ff8a3d; --sun:#ffb84d;
  --aqua:#3de3d2; --gold:#ffd166; --red:#ff6b81;
  --sunset:linear-gradient(120deg,#ff3d8b 0%,#ff5f6d 40%,#ff8a3d 75%,#ffb84d 100%);
  --disp:'Russo One',Impact,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{background:var(--night);color:var(--text);font:16px/1.5 'Golos Text',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;left:50%;top:-30vh;width:160vw;max-width:1200px;height:70vh;transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,61,139,.30),rgba(255,138,61,.12) 55%,transparent)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:12px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;margin:0 -16px;padding:0 16px;background:linear-gradient(var(--night) 70%,rgba(19,10,36,0))}
.brand{font-family:var(--disp);font-size:22px;line-height:1;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;white-space:nowrap}
.room{white-space:nowrap}
@media(max-width:400px){#stTxt{display:none}}
.room{display:flex;align-items:center;gap:8px;height:40px;padding:0 5px 0 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.room .code{font-family:var(--disp);font-size:15px;letter-spacing:.12em;color:var(--text)}
.room .sh{display:grid;place-items:center;width:30px;height:30px;border-radius:99px;background:var(--sunset);color:var(--night)}
.room .sh svg{width:15px;height:15px;stroke-width:2.6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.online{background:var(--aqua);box-shadow:0 0 0 3px rgba(61,227,210,.22)}
.dot.waiting{background:var(--sun);animation:blink 1.6s infinite}
.dot.connecting{background:var(--mute);animation:blink .9s infinite}
@keyframes blink{50%{opacity:.3}}

/* period chips */
.chips{display:flex;gap:8px;margin:4px 0 16px}
.chips button{height:38px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:700;color:var(--mute);background:var(--card);border:1px solid var(--line);transition:background .2s,color .2s}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--night);border-color:transparent}

/* hero duel */
.duel{position:relative;border-radius:30px;padding:20px 18px 18px;background:var(--sunset);color:var(--night);overflow:hidden;box-shadow:0 24px 60px -20px rgba(255,61,139,.55)}
.duel::after{content:"";position:absolute;right:-60px;bottom:-110px;width:260px;height:260px;border-radius:50%;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.22) 0 9px,transparent 9px 18px);
  -webkit-mask:linear-gradient(transparent 35%,#000 80%);mask:linear-gradient(transparent 35%,#000 80%);pointer-events:none}
.duel .hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;opacity:.8}
.pair{position:relative;z-index:1;display:grid;grid-template-columns:1fr 44px 1fr;align-items:start;margin-top:14px}
.pl{min-width:0}
.pl.r{text-align:right}
.ava{position:relative;display:inline-grid;place-items:center;width:52px;height:52px;border-radius:18px;font-family:var(--disp);font-size:22px;color:var(--text)}
.ava.me{background:var(--night)}
.ava.op{background:#0e5a55;color:#dffcf8}
.ava .cr{position:absolute;top:-12px;right:-10px;width:26px;height:26px;color:var(--night);fill:#ffe39a;stroke-width:1.8}
.pl.r .ava .cr{right:auto;left:-10px}
.pl .nm{margin-top:8px;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .kg{font-family:var(--disp);font-size:clamp(30px,9.5vw,42px);line-height:1.05;margin-top:2px;white-space:nowrap}
.pl .kg small{font-size:.42em;margin-left:3px}
.pl .sp{font-size:13px;font-weight:600;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.trail .kg{opacity:.55}
.vs{display:grid;place-items:center;width:44px;height:44px;margin-top:4px;border-radius:50%;background:rgba(19,10,36,.88);color:var(--sun);font-family:var(--disp);font-size:14px}
.lead{position:relative;z-index:1;margin-top:18px}
.lead .track{display:flex;height:10px;border-radius:10px;overflow:hidden;background:rgba(19,10,36,.25);gap:3px}
.lead .track i{height:100%;border-radius:10px;transition:flex-grow .8s var(--ease)}
.lead .track .me{background:var(--night)}
.lead .track .op{background:#0e5a55}
.lead p{margin-top:10px;font-size:15px;font-weight:700}
.invite{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 12px 12px 16px;border-radius:18px;background:rgba(19,10,36,.88);color:var(--text);font-size:14px}
.invite b{font-family:var(--disp);letter-spacing:.12em}

/* stats */
.sec{margin-top:30px}
.sec h2{font-family:var(--disp);font-size:20px;margin-bottom:6px}
.tr{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr .vals{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:10px}
.tr .lab{font-size:13px;color:var(--mute);font-weight:600;text-align:center}
.tr .v{font-family:var(--disp);font-size:19px;color:rgba(255,243,248,.5)}
.tr .v.r{text-align:right}
.tr .v.win.me{color:var(--pink)} .tr .v.win.op{color:var(--aqua)}
.bar{display:flex;height:6px;margin-top:8px;border-radius:6px;overflow:hidden;background:rgba(255,226,244,.06);gap:3px}
.bar i{height:100%;border-radius:6px;transition:flex-grow .7s var(--ease)}
.bar .me{background:var(--pink)} .bar .op{background:var(--aqua)}

/* log */
.day{font-size:13px;font-weight:700;color:var(--dim);margin:20px 0 4px}
.day:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-family:var(--disp);font-size:17px;flex:none}
.av.me{background:var(--pink);color:var(--night)} .av.op{background:var(--aqua);color:var(--night)}
.row .m{flex:1;min-width:0}
.row .m b{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0}
.row .m b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m em{display:block;font-style:normal;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .wt{text-align:right;white-space:nowrap}
.row .wt b{display:block;font-family:var(--disp);font-size:19px;font-weight:400}
.row .wt em{font-style:normal;font-size:12px;color:var(--dim)}
.tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:800}
.tag.rec{background:var(--sunset);color:var(--night)}
.tag.pb{background:rgba(255,226,244,.1);color:var(--text)}
.tag.new{background:rgba(61,227,210,.14);color:var(--aqua)}
.ib{display:grid;place-items:center;width:44px;height:44px;margin:-4px -8px;border-radius:14px;color:var(--dim);flex:none}
.ib:hover{background:var(--card);color:var(--text)}
.ib.pin{color:var(--sun)}
.ib svg{width:19px;height:19px}

/* species */
.colhd{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--card)}
.ring{--p:0;flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) calc(var(--p)*1%),var(--orange) calc(var(--p)*1%),rgba(255,226,244,.08) 0);-webkit-mask:radial-gradient(farthest-side,transparent 72%,#000 73%);mask:radial-gradient(farthest-side,transparent 72%,#000 73%)}
.ringwrap{position:relative;width:72px;height:72px;flex:none}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:17px}
.colhd p{font-size:14px;color:var(--mute);line-height:1.45}
.colhd p b{color:var(--text);font-weight:700}
.spc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.spc .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--card);color:var(--dim);flex:none}
.spc.got .ic{background:var(--sunset);color:var(--night)}
.spc .t{flex:1;min-width:0}
.spc .t b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spc .t em{display:block;font-style:normal;font-size:13px;color:var(--dim)}
.spc .bests{display:grid;gap:2px;text-align:right;font-family:var(--disp);font-size:15px;white-space:nowrap}
.spc .bests span{color:rgba(255,243,248,.35)}
.spc .bests .me.on{color:var(--pink)} .spc .bests .op.on{color:var(--aqua)}
.locked{margin-top:14px;padding:16px;border-radius:20px;border:1.5px dashed var(--line2);color:var(--mute);font-size:14px}
.locked b{color:var(--text)}

.empty{padding:34px 20px;text-align:center;color:var(--mute);font-size:15px;border:1.5px dashed var(--line2);border-radius:22px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

details.about{margin-top:34px;border-top:1px solid var(--line)}
details.about summary{display:flex;align-items:center;gap:8px;height:52px;font-weight:700;color:var(--mute);cursor:pointer;list-style:none}
details.about summary::-webkit-details-marker{display:none}
details.about ul{list-style:none;display:grid;gap:10px;font-size:14px;color:var(--mute);padding:2px 0 8px}
details.about li b{color:var(--text)}
details.about a{color:var(--aqua)}
.foot{display:flex;flex-wrap:wrap;gap:0 18px}
.foot button{display:inline-flex;align-items:center;gap:6px;height:44px;color:var(--mute);font-weight:600;font-size:14px}
.foot button svg{width:17px;height:17px}

/* map view */
#v-map{position:fixed;left:0;right:0;top:62px;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:5}
#bigmap{position:absolute;inset:0;background:#2fd0c6}
.mapbar{position:absolute;z-index:500;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .chips{margin:0}
.mapbar .chips button{background:rgba(19,10,36,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mapbar .chips button[aria-pressed="true"]{background:var(--text)}
.maphint{position:absolute;z-index:500;left:12px;bottom:14px;max-width:calc(100% - 84px);overflow:hidden;text-overflow:ellipsis;padding:9px 14px;border-radius:99px;background:rgba(19,10,36,.86);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;pointer-events:none}
.leaflet-container{font:inherit;background:#2fd0c6}
.leaflet-control-attribution{background:rgba(19,10,36,.7)!important;color:var(--mute)!important;font-size:10px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--mute)!important}
.leaflet-popup-content-wrapper{background:var(--night2);color:var(--text);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.leaflet-popup-tip{background:var(--night2)}
.leaflet-popup-content{margin:14px 16px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{display:block;font-size:15px}
.leaflet-popup-content .w{font-family:var(--disp);font-size:20px;margin:2px 0}
.leaflet-popup-content em{font-style:normal;color:var(--mute);font-size:13px}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute);width:30px;height:30px;font-size:20px}
.pop-add{display:flex;align-items:center;gap:6px;margin-top:2px;height:40px;padding:0 14px;border-radius:99px;background:var(--sunset);color:var(--night);font-weight:800;font-size:14px}
.pin{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid var(--night);box-shadow:0 6px 14px rgba(19,10,36,.45)}
.pin.me{background:var(--pink)} .pin.op{background:var(--aqua)}
.pin.best::after{content:"";position:absolute;inset:-8px;border-radius:50% 50% 50% 0;border:2px solid var(--gold)}
.zoombtns{position:absolute;z-index:500;right:12px;bottom:14px;display:grid;gap:6px}
.zoombtns button{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(19,10,36,.86);color:var(--text)}

/* bottom nav */
.nav{position:fixed;z-index:35;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:rgba(19,10,36,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav .in{max-width:560px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav .tb{display:grid;justify-items:center;gap:3px;height:100%;align-content:center;font-size:11px;font-weight:700;color:var(--dim);transition:color .2s}
.nav .tb[aria-current="page"]{color:var(--text)}
.nav .tb[aria-current="page"] svg{color:var(--pink)}
.nav .add{justify-self:center;display:grid;place-items:center;width:62px;height:62px;margin-top:-26px;border-radius:22px;background:var(--sunset);color:var(--night);box-shadow:0 12px 30px -6px rgba(255,61,139,.7),0 0 0 6px var(--night);transition:transform .15s}
.nav .add:active{transform:scale(.94)}
.nav .add svg{width:28px;height:28px;stroke-width:2.6}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:18px;font-weight:800;font-size:16px;transition:transform .12s,filter .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sunset);color:var(--night)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.sm{height:44px;padding:0 16px;font-size:14px;border-radius:14px}
.btn svg{width:19px;height:19px;stroke-width:2.5}
.fld{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.fld span{font-weight:500;color:var(--dim)}
.inp{width:100%;height:54px;padding:0 16px;border-radius:16px;background:var(--night);border:1.5px solid var(--line2);outline:none;transition:border-color .15s;font-size:16px}
.inp:focus{border-color:var(--pink)}
.inp::placeholder{color:var(--dim)}
.msg{font-size:14px;margin-top:8px;min-height:21px;color:var(--mute)}
.msg.err{color:var(--red)}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700;color:var(--sun)}

/* setup */
.setup .duel{padding:26px 22px}
.setup h1{position:relative;z-index:1;font-family:var(--disp);font-weight:400;font-size:clamp(38px,11vw,52px);line-height:1.02}
.setup .duel p{position:relative;z-index:1;margin-top:12px;font-size:16px;font-weight:600;max-width:30ch}
.setup form{margin-top:26px}
.join{display:grid;grid-template-columns:1fr auto;gap:10px}
.codeinp{font-family:var(--disp);font-size:22px;letter-spacing:.3em;text-transform:uppercase}
.or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--dim);font-size:13px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,4,16,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:94vh;display:flex;flex-direction:column;background:var(--night2);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;transform:translateY(30px);transition:transform .3s var(--ease)}
.ov.open .sheet{transform:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line)}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.sh-h h2{font-family:var(--disp);font-weight:400;font-size:24px}
.x{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--card);color:var(--mute)}
.sh-b{overflow:auto;padding:8px 18px 4px;overscroll-behavior:contain}
.sh-f{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-f .btn{width:100%}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);width:18px;height:18px}
.search .inp{padding-left:42px;height:48px}
.list{margin-top:8px;max-height:min(30vh,260px);overflow:auto;border-radius:18px;border:1px solid var(--line);background:var(--night)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:700;font-size:15px}
.opt .t em{display:block;font-style:normal;font-size:13px;color:var(--dim)}
.opt .rb{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.opt[aria-checked="true"]{background:var(--card)}
.opt[aria-checked="true"] .rb{border:0;background:var(--sunset);color:var(--night)}
.opt .rb svg{width:14px;height:14px;stroke-width:3.2;opacity:0}
.opt[aria-checked="true"] .rb svg{opacity:1}
.opt.add .t b{color:var(--sun)}
.blk{margin-top:20px}
.kgbox{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;height:76px;padding:0 10px;border-radius:22px;background:var(--night);border:1.5px solid var(--line2);transition:border-color .15s}
.kgbox:focus-within{border-color:var(--pink)}
.kgbox button,.lbbox button{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--card2);color:var(--text)}
.kgbox button:active,.lbbox button:active{background:var(--raise)}
.kgbox label{display:flex;align-items:baseline;justify-content:center;gap:6px}
.kgbox input{width:100%;min-width:0;max-width:170px;border:0;outline:none;background:none;text-align:right;font-family:var(--disp);font-size:38px;-moz-appearance:textfield}
.kgbox input::placeholder{color:var(--dim)}
.kgbox .u{font-size:18px;font-weight:800;color:var(--mute)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.lbrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lbbox{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:56px;padding:0 6px;border-radius:16px;background:var(--night);border:1.5px solid var(--line2)}
.lbbox button{width:40px;height:40px;border-radius:12px}
.lbbox label{display:flex;align-items:baseline;justify-content:center;gap:4px}
.lbbox input{width:100%;min-width:0;border:0;outline:none;background:none;text-align:right;font-family:var(--disp);font-size:22px;-moz-appearance:textfield}
.lbbox .u{font-size:13px;font-weight:700;color:var(--mute);width:20px}
.locbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:18px;background:var(--night);border:1.5px dashed var(--line2);text-align:left}
.locbtn .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--card2);color:var(--sun);flex:none}
.locbtn.on{border-style:solid;border-color:rgba(255,184,77,.5)}
.locbtn.on .ic{background:var(--sunset);color:var(--night)}
.locbtn .t b{display:block;font-weight:700;font-size:15px}
.locbtn .t em{display:block;font-style:normal;font-size:13px;color:var(--dim)}

/* picker */
.picker{position:fixed;inset:0;z-index:80;background:#2fd0c6;display:none}
.picker.open{display:block}
#pickmap{position:absolute;inset:0}
.pk-top{position:absolute;z-index:600;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgba(19,10,36,.92),rgba(19,10,36,0))}
.pk-top h3{font-family:var(--disp);font-weight:400;font-size:20px}
.pk-top .x{background:rgba(19,10,36,.86);color:var(--text)}
.cross{position:absolute;z-index:550;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;pointer-events:none}
.cross .pin{position:absolute;left:2px;top:0;width:30px;height:30px;background:var(--sun)}
.cross::after{content:"";position:absolute;left:12px;bottom:-6px;width:10px;height:4px;border-radius:50%;background:rgba(19,10,36,.5)}
.pk-bot{position:absolute;z-index:600;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(19,10,36,0),rgba(19,10,36,.92) 35%)}
.pk-bot .btn{width:100%;max-width:528px;margin:0 auto;display:flex}

/* toast */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:100;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 18px 12px 14px;border-radius:18px;background:var(--text);color:var(--night);font-weight:700;font-size:15px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.toast.show{transform:translate(-50%,0)}
.toast.rec{background:var(--sunset)}
.toast svg{width:20px;height:20px}
.duel.pop{animation:pop .7s var(--ease)}
@keyframes pop{30%{transform:scale(1.025);box-shadow:0 30px 80px -10px rgba(255,61,139,.9)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
/* ---------- Species confirmed in the released game (Nov 2026). The fishing log has 35. ---------- */
const TOTAL=35;
const BASE=[
  ['Stoplight Parrotfish','Рыба-попугай'],
  ['Atlantic Spanish Mackerel','Атлантическая испанская макрель'],
  ['Great Barracuda','Большая барракуда'],
  ['Greater Amberjack','Большая сериола'],
  ['Mahi-Mahi','Корифена (махи-махи)'],
  ['Yellowfin Tuna','Желтопёрый тунец'],
  ['Atlantic Tarpon','Атлантический тарпон'],
  ['Candy Fish','Название из игры']
];
const RU=Object.fromEntries(BASE);

/* ---------- state ---------- */
const LS='fishduel.v1',ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rid=n=>{let s='';const a=new Uint32Array(n);crypto.getRandomValues(a);for(const x of a)s+=ABC[x%ABC.length];return s};
let S={};try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
S.pid=S.pid||rid(12);S.catches=S.catches||{};S.deleted=S.deleted||{};S.names=S.names||{};
for(const c of Object.values(S.catches)){if(c.g==null&&Number.isInteger(c.oz)){c.g=Math.round(c.oz*28.3495);delete c.oz}}
let period=['today','week','all'].includes(S.period)?S.period:'today',view=['board','map','log','species'].includes(S.view)?S.view:'board';
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const kg=g=>(g/1000).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const kgT=g=>kg(g)+' кг';
const lbT=g=>{const oz=Math.round(g/28.3495),l=Math.floor(oz/16),o=oz%16;return o?`${l} lb ${o} oz`:`${l} lb`};
const nm=pid=>S.names[pid]||'Друг';
const ini=s=>(s.trim()[0]||'?').toUpperCase();
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};

/* ---------- networking: PeerJS / WebRTC ---------- */
const PFX='fishduel-v1-';
let peer=null,conns=[],isHost=false,gen=0,retryT=null,net='off';
function setNet(s){net=s;renderStatus()}
function cleanup(){clearTimeout(retryT);gen++;conns.forEach(c=>{try{c.close()}catch(e){}});conns=[];if(peer){try{peer.destroy()}catch(e){}peer=null}}
function retry(){const g=gen;setNet('connecting');clearTimeout(retryT);retryT=setTimeout(()=>{if(g===gen)join()},2500+Math.random()*1500)}
function join(){
  cleanup();if(!S.room)return;
  if(typeof Peer==='undefined'){setNet('off');return}
  const g=gen;setNet('connecting');
  const p=new Peer(PFX+S.room,{debug:0});peer=p;
  p.on('open',()=>{if(g!==gen)return;isHost=true;setNet(conns.length?'online':'waiting')});
  p.on('connection',c=>{if(g===gen)wire(c,g)});
  p.on('disconnected',()=>{if(g===gen&&!p.destroyed){try{p.reconnect()}catch(e){}}});
  p.on('error',e=>{if(g!==gen)return;if(e.type==='unavailable-id'){try{p.destroy()}catch(_){}guest(g)}else if(e.type!=='peer-unavailable')retry()});
}
function guest(g){isHost=false;const p=new Peer({debug:0});peer=p;
  p.on('open',()=>{if(g!==gen)return;wire(p.connect(PFX+S.room,{reliable:true}),g)});
  p.on('error',()=>{if(g===gen)retry()})}
function wire(c,g){
  c.on('open',()=>{if(g!==gen)return;conns.push(c);c.send(hello());setNet('online')});
  c.on('data',d=>{if(g===gen)onData(d,c)});
  c.on('close',()=>{if(g!==gen)return;conns=conns.filter(x=>x!==c);if(!conns.length){if(isHost)setNet('waiting');else retry()}});
  c.on('error',()=>{});
}
const hello=()=>({t:'hello',names:S.names,catches:Object.values(S.catches),deleted:Object.keys(S.deleted)});
function send(m,ex){conns.forEach(c=>{if(c!==ex&&c.open){try{c.send(m)}catch(e){}}})}
const num01=v=>v==null||(typeof v==='number'&&v>=0&&v<=1);
function okCatch(c){
  if(!c||typeof c.id!=='string'||c.id.length>=40||typeof c.pid!=='string'||c.pid.length>=40)return false;
  if(typeof c.sp!=='string'||!c.sp.trim()||c.sp.length>40||typeof c.ts!=='number')return false;
  const g=c.g!=null?c.g:(Number.isInteger(c.oz)?Math.round(c.oz*28.3495):null);
  if(!Number.isInteger(g)||g<=0||g>500000)return false;
  if(c.note!=null&&(typeof c.note!=='string'||c.note.length>50))return false;
  return num01(c.x)&&num01(c.y);
}
function clean(c){const o={id:c.id,pid:c.pid,sp:c.sp.trim(),g:c.g!=null?c.g:Math.round(c.oz*28.3495),ts:c.ts,note:c.note?String(c.note).trim():''};if(c.x!=null&&c.y!=null){o.x=c.x;o.y=c.y}return o}
function onData(d,from){
  if(!d||typeof d!=='object')return;let ch=false;
  if(d.t==='hello'){
    if(d.names&&typeof d.names==='object')for(const[k,v]of Object.entries(d.names)){if(k!==S.pid&&typeof v==='string'&&v.length<=18&&S.names[k]!==v){S.names[k]=v;ch=true}}
    if(Array.isArray(d.deleted))for(const id of d.deleted){if(typeof id==='string'&&!S.deleted[id]){S.deleted[id]=1;delete S.catches[id];ch=true}}
    if(Array.isArray(d.catches))for(const c of d.catches){if(okCatch(c)&&!S.deleted[c.id]&&!S.catches[c.id]){S.catches[c.id]=clean(c);ch=true}}
    if(ch&&isHost)send(hello(),from);
  }else if(d.t==='add'&&okCatch(d.c)&&!S.deleted[d.c.id]&&!S.catches[d.c.id]){
    const c=clean(d.c),r=recordOf(c);S.catches[c.id]=c;ch=true;if(isHost)send(d,from);
    toast(`${nm(c.pid)}: ${c.sp}, ${kgT(c.g)}`,r==='rec');
  }else if(d.t==='del'&&typeof d.id==='string'&&!S.deleted[d.id]){S.deleted[d.id]=1;delete S.catches[d.id];ch=true;if(isHost)send(d,from)}
  if(ch){save();render()}
}

/* ---------- stats ---------- */
function since(){const n=new Date();if(period==='today'){n.setHours(0,0,0,0);return+n}if(period==='week')return Date.now()-7*864e5;return 0}
const all=()=>Object.values(S.catches).filter(c=>!S.deleted[c.id]);
const inPeriod=()=>all().filter(c=>c.ts>=since());
function players(){const ids=new Set([S.pid,...Object.keys(S.names),...all().map(c=>c.pid)]);return[S.pid,...[...ids].filter(x=>x!==S.pid)]}
function stats(list){const P={};for(const pid of players())P[pid]={pid,count:0,total:0,best:null,sp:{}};
  for(const c of list){const p=P[c.pid];if(!p)continue;p.count++;p.total+=c.g;if(!p.best||c.g>p.best.g)p.best=c;if(!p.sp[c.sp]||c.g>p.sp[c.sp].g)p.sp[c.sp]=c}return P}
function recordOf(c){const L=all().filter(x=>x.id!==c.id);const room=L.reduce((m,x)=>Math.max(m,x.g),0);
  if(L.length&&c.g>room)return'rec';const own=L.filter(x=>x.pid===c.pid&&x.sp===c.sp);if(!own.length)return'new';if(c.g>Math.max(...own.map(x=>x.g)))return'pb';return null}
function rival(P){const o=players().slice(1).map(id=>P[id]);if(!o.length)return null;return o.sort((a,b)=>(b.best?b.best.g:0)-(a.best?a.best.g:0)||b.count-a.count)[0]}
function badges(){const L=all().sort((a,b)=>a.ts-b.ts),out={};let room=0;const per={};
  for(const c of L){const k=c.pid+'|'+c.sp;if(c.g>room&&room>0)out[c.id]='rec';else if(per[k]&&c.g>per[k])out[c.id]='pb';else if(!per[k])out[c.id]='new';room=Math.max(room,c.g);per[k]=Math.max(per[k]||0,c.g)}return out}
const PL={today:'сегодня',week:'за 7 дней',all:'за всё время'};
const chipsHTML=()=>['today','week','all'].map(p=>`<button data-p="${p}" aria-pressed="${p===period}">${{today:'Сегодня',week:'7 дней',all:'Всё время'}[p]}</button>`).join('');

/* ---------- render ---------- */

function renderStatus(){$('#dot').className='dot '+net;$('#stTxt').textContent=STXT[net];$('#codeTxt').textContent=S.room||''}

function boardHTML(){
  const L=inPeriod(),P=stats(L),me=P[S.pid],op=rival(P);
  const a=me.best?me.best.g:0,b=op&&op.best?op.best.g:0,meL=a>b,opL=!!op&&b>a;
  const pl=(p,cls,lead,r)=>`<div class="pl${r?' r':''}${(a||b)&&!lead?' trail':''}">
    <div class="ava ${cls}">${esc(ini(p?nm(p.pid):'?'))}${lead?`<svg class="i cr" aria-label="Лидер"><use href="#i-crown"/></svg>`:''}</div>
    <div class="nm">${p?esc(nm(p.pid))+(p.pid===S.pid?' (ты)':''):'Друг'}</div>
    <div class="kg">${p&&p.best?kg(p.best.g)+'<small>кг</small>':'—'}</div>
    <div class="sp">${p&&p.best?esc(p.best.sp):p?'пока без улова':'не в комнате'}</div></div>`;
  let foot;
  if(!op)foot=`<div class="invite"><span>Отправь другу код <b>${esc(S.room)}</b></span><button class="btn pri sm" data-share>${ic('share')}Отправить</button></div>`;
  else{const msg=!a&&!b?`Первая рыба ${PL[period]} ещё впереди`:a===b?'Ничья до грамма':meL?`Ты впереди на ${kgT(a-b)}`:`${esc(nm(op.pid))} впереди на ${kgT(b-a)}`;
    foot=`<div class="lead"><div class="track">${a||b?`<i class="me" style="flex-grow:${a}"></i><i class="op" style="flex-grow:${b}"></i>`:''}</div><p>${msg}</p></div>`}
  let h=`<div class="chips" data-chips>${chipsHTML()}</div>
    <div class="duel" id="duel"><div class="hd"><span>Самая тяжёлая рыба ${PL[period]}</span></div>
    <div class="pair">${pl(me,'me',meL,false)}<div class="vs">VS</div>${pl(op,'op',opL,true)}</div>${foot}</div>`;
  if(L.length){
    const wins={[S.pid]:0};if(op)wins[op.pid]=0;
    for(const sp of new Set(L.map(c=>c.sp))){const x=me.sp[sp],y=op&&op.sp[sp];if(x&&(!y||x.g>y.g))wins[S.pid]++;else if(y&&(!x||y.g>x.g))wins[op.pid]++}
    const rows=[['Общий вес',p=>p?p.total:0,v=>v?kgT(v):'—'],['Поймано рыб',p=>p?p.count:0,v=>v],['Разных видов',p=>p?Object.keys(p.sp).length:0,v=>v],
      ['Рекордов по видам',p=>p?wins[p.pid]||0:0,v=>v],['Средний вес',p=>p&&p.count?Math.round(p.total/p.count):0,v=>v?kgT(v):'—']];
    h+=`<div class="sec"><h2>Счёт ${PL[period]}</h2>`+rows.map(([l,f,s])=>{const x=f(me),y=f(op);
      return `<div class="tr"><div class="vals"><span class="v${x>y?' win me':''}">${s(x)}</span><span class="lab">${l}</span><span class="v r${y>x?' win op':''}">${op?s(y):'—'}</span></div><div class="bar">${x+y?`<i class="me" style="flex-grow:${x}"></i><i class="op" style="flex-grow:${y}"></i>`:''}</div></div>`}).join('')+'</div>';
  }else h+=`<div class="sec"><div class="empty"><b>Табло пустое</b>Запиши первую рыбу кнопкой с плюсом внизу.</div></div>`;
  h+=`<details class="about"><summary>${ic('info')}Как устроена рыбалка в GTA VI</summary><ul>
    <li>После поимки игра показывает <b>вид и вес</b>, а также твой рекорд по этому виду. Сюда переноси эти же цифры. Если игра пишет фунты, в форме есть ввод в lb и oz, он сам переведёт в кг.</li>
    <li>Все рекорды есть в игре: <b>Пауза, Progress, Animals, Fishing</b>. В журнале 35 видов.</li>
    <li>Публично подтверждены пока 8 видов, они уже в списке. Остальные добавляй сам, когда поймаешь: «Другой вид» при записи, и он появится у вас обоих.</li>
    <li>Первое задание Кэла: <b>Stoplight Parrotfish тяжелее 2 lb (0,91 кг)</b>. Испытание Big Fish: рыба от 20 lb (9,07 кг). Pro Angler: поймать все виды.</li>
    <li>Карта: официальная карта Леониды © Rockstar Games. Источники по рыбалке: <a href="https://leonipedia.com/guides/fishing/" target="_blank" rel="noopener">Leonipedia</a>, <a href="https://outputlag.com/guides/gta-6-fishing-guide/" target="_blank" rel="noopener">Outputlag</a>, <a href="https://www.powerpyx.com/gta-6-all-challenges-guide/" target="_blank" rel="noopener">PowerPyx</a>. Фанатский проект, не связан с Rockstar Games.</li></ul></details>
    <div class="foot"><button id="renameBtn">${ic('edit')}Сменить имя</button><button id="leaveBtn">${ic('out')}Выйти из комнаты</button></div>`;
  return h;
}
function logHTML(){
  const L=inPeriod();let h=`<div class="chips" data-chips>${chipsHTML()}</div>`;
  if(!L.length)return h+`<div class="empty"><b>Журнал пуст</b>Каждая записанная рыба появится здесь со временем и местом.</div>`;
  const B=badges(),sorted=[...L].sort((a,b)=>b.ts-a.ts),td=new Date().toDateString(),yd=new Date(Date.now()-864e5).toDateString();let last='';
  for(const c of sorted.slice(0,150)){
    const d=new Date(c.ts),ds=d.toDateString();
    if(ds!==last){last=ds;h+=`<div class="day">${ds===td?'Сегодня':ds===yd?'Вчера':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div>`}
    const mine=c.pid===S.pid,b=B[c.id];
    const tag=b==='rec'?'<span class="tag rec">Рекорд</span>':b==='pb'?'<span class="tag pb">Личный</span>':b==='new'?'<span class="tag new">Новый вид</span>':'';
    h+=`<div class="row"><div class="av ${mine?'me':'op'}" aria-hidden="true">${esc(ini(nm(c.pid)))}</div>
      <div class="m"><b><span>${esc(c.sp)}</span>${tag}</b><em>${esc(nm(c.pid))}, ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}${c.note?', '+esc(c.note):''}</em></div>
      <div class="wt"><b>${kg(c.g)} кг</b><em>${lbT(c.g)}</em></div>
      ${c.x!=null?`<button class="ib pin" data-goto="${esc(c.id)}" aria-label="Показать на карте">${ic('pin')}</button>`:''}
      ${mine?`<button class="ib" data-del="${esc(c.id)}" aria-label="Удалить ${esc(c.sp)}">${ic('trash')}</button>`:''}</div>`;
  }
  return h;
}
function speciesHTML(){
  const A=all(),P=stats(A),me=P[S.pid],op=rival(P);
  const known=[...new Set([...BASE.map(b=>b[0]),...A.map(c=>c.sp)])];
  const got=new Set(A.map(c=>c.sp));
  known.sort((a,b)=>got.has(b)-got.has(a));
  const pct=Math.round(got.size/TOTAL*100);
  let h=`<div class="colhd"><div class="ringwrap"><div class="ring" style="--p:${pct}"></div><span>${got.size}</span></div>
    <p><b>${got.size} из ${TOTAL} видов</b> поймали вы вдвоём за всё время. Справа ваши лучшие экземпляры каждого вида.</p></div>`;
  h+=known.map(s=>{const x=me.sp[s],y=op&&op.sp[s],g=got.has(s);
    return `<div class="spc${g?' got':''}"><div class="ic">${ic('fish')}</div><div class="t"><b>${esc(s)}</b><em>${esc(RU[s]||'добавлено вами')}</em></div>
      <div class="bests"><span class="me${x&&(!y||x.g>=y.g)?' on':''}">${x?kgT(x.g):'—'}</span><span class="op${y&&(!x||y.g>=x.g)?' on':''}">${y?kgT(y.g):'—'}</span></div></div>`}).join('');
  const rest=TOTAL-known.length;
  if(rest>0)h+=`<div class="locked"><b>Ещё ${rest} ${plural(rest,'вид','вида','видов')} не открыто.</b> Их названия пока нигде не опубликованы. Поймал новую рыбу? При записи выбери «Другой вид», и она появится здесь.</div>`;
  return h;
}

/* ---------- maps (Leaflet, official Leonida map) ---------- */
const MW=3000,MH=4142,MB=[[0,0],[MH,MW]],MAPIMG='assets/leonida-map.webp';
function makeMap(el){
  const m=L.map(el,{crs:L.CRS.Simple,zoomControl:false,zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:90,maxBounds:[[-300,-300],[MH+300,MW+300]],maxBoundsViscosity:.9,attributionControl:true});
  L.imageOverlay(MAPIMG,MB).addTo(m);m.attributionControl.setPrefix(false).addAttribution('Карта © Rockstar Games');
  fitAll(m);return m;
}
function fitAll(m){m.invalidateSize();m.setMinZoom(-12);m.setMaxZoom(12);m.fitBounds(MB,{animate:false});const z=m.getZoom();m.setMinZoom(z-.25);m.setMaxZoom(z+3.5)}
const toLL=c=>[c.y*MH,c.x*MW], toXY=ll=>({x:Math.min(1,Math.max(0,ll.lng/MW)),y:Math.min(1,Math.max(0,ll.lat/MH))});
let bigmap=null,layer=null,focusId=null;
function pinIcon(cls){return L.divIcon({className:'',html:`<div class="pin ${cls}"></div>`,iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-34]})}
function renderMap(){
  document.querySelectorAll('#v-map [data-chips]').forEach(e=>e.innerHTML=chipsHTML());
  if(!bigmap){bigmap=makeMap($('#bigmap'));layer=L.layerGroup().addTo(bigmap);
    bigmap.on('click',e=>{const xy=toXY(e.latlng);L.popup({closeButton:true}).setLatLng(e.latlng).setContent(`<button class="pop-add" data-addat="${xy.x.toFixed(5)},${xy.y.toFixed(5)}">${ic('plus')}Записать улов здесь</button>`).openOn(bigmap)});
    $('#zin').onclick=()=>bigmap.zoomIn();$('#zout').onclick=()=>bigmap.zoomOut()}
  if(!bigmap._fitted){setTimeout(()=>{fitAll(bigmap);bigmap._fitted=true},0)}else setTimeout(()=>bigmap.invalidateSize(),0);
  layer.clearLayers();
  const L2=inPeriod().filter(c=>c.x!=null);const best=L2.reduce((m,c)=>!m||c.g>m.g?c:m,null);
  let target=null;
  for(const c of L2.sort((a,b)=>a.g-b.g)){
    const mk=L.marker(toLL(c),{icon:pinIcon((c.pid===S.pid?'me':'op')+(best&&c.id===best.id?' best':'')),keyboard:true,title:c.sp}).addTo(layer);
    mk.bindPopup(`<b>${esc(c.sp)}</b><div class="w">${kgT(c.g)}</div><em>${esc(nm(c.pid))}, ${new Date(c.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${c.note?'<br>'+esc(c.note):''}</em>`);
    if(c.id===focusId)target=mk;
  }
  $('#maphint').textContent=L2.length?`${L2.length} ${plural(L2.length,'метка','метки','меток')} ${PL[period]}`:'Нажми на место, где поймал рыбу';
  if(target){setTimeout(()=>{bigmap.setView(target.getLatLng(),bigmap.getMinZoom()+2.5);target.openPopup()},60);focusId=null}
}

/* ---------- add sheet ---------- */
let pick=null,loc=null,lastFocus=null;
function speciesList(){const used={};all().forEach(c=>used[c.sp]=(used[c.sp]||0)+1);
  return[...new Set([...BASE.map(b=>b[0]),...Object.keys(used)])].sort((a,b)=>(used[b]||0)-(used[a]||0)||a.localeCompare(b))}
function renderList(){
  const q=$('#spSearch').value.trim().toLowerCase();
  const L=speciesList().filter(s=>!q||s.toLowerCase().includes(q)||(RU[s]||'').toLowerCase().includes(q));
  $('#list').innerHTML=L.map(s=>`<button type="button" class="opt" role="radio" aria-checked="${pick===s}" data-sp="${esc(s)}"><span class="t"><b>${esc(s)}</b><em>${esc(RU[s]||'добавлено вами')}</em></span><span class="rb">${ic('check')}</span></button>`).join('')
    +`<button type="button" class="opt add" role="radio" aria-checked="${pick==='__new'}" data-sp="__new"><span class="t"><b>Другой вид</b><em>Рыбы нет в списке, добавить новую</em></span><span class="rb">${ic('check')}</span></button>`;
}
function renderLoc(){const b=$('#locBtn');b.classList.toggle('on',!!loc);$('#locT').textContent=loc?'Место отмечено':'Отметить на карте';$('#locS').textContent=loc?'Нажми, чтобы изменить':'Покажи, где клюнуло'}
function openSheet(at){
  lastFocus=document.activeElement;pick=null;loc=at||null;
  ['#spSearch','#spCustom','#kgIn','#lbIn','#ozIn','#noteIn'].forEach(s=>$(s).value='');
  $('#customBlk').classList.add('hidden');$('#lbRow').classList.add('hidden');$('#wHint').textContent='';$('#wHint').className='msg';
  renderList();renderLoc();const ov=$('#ov');ov.classList.add('open');ov.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  setTimeout(()=>$('#spSearch').focus({preventScroll:true}),60);
}
function closeSheet(){const ov=$('#ov');ov.classList.remove('open');ov.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
function readKg(){const v=$('#kgIn').value.replace(',','.').replace(/[^\d.]/g,'');const n=parseFloat(v);return isNaN(n)?0:Math.round(n*1000)}
function setKg(g){$('#kgIn').value=g>0?(g/1000).toFixed(2).replace('.',','):''}
function hint(){
  const g=readKg(),h=$('#wHint');h.className='msg';if(!g){h.textContent='';return}
  const P=stats(all()),pb=pick&&pick!=='__new'&&P[S.pid].sp[pick];
  h.textContent=lbT(g)+(pb?(g>pb.g?`, это твой новый рекорд (был ${kgT(pb.g)})`:`, твой рекорд ${kgT(pb.g)}`):'');
}
function fromLb(){const l=parseInt($('#lbIn').value||'0',10)||0,o=parseInt($('#ozIn').value||'0',10)||0;setKg(Math.round((l*16+o)*28.3495));hint()}
function stepLb(k,d){let l=parseInt($('#lbIn').value||'0',10)||0,o=parseInt($('#ozIn').value||'0',10)||0;
  if(k==='lb')l=Math.max(0,l+d);else{o+=d;if(o>15){o=0;l++}else if(o<0){if(l>0){o=15;l--}else o=0}}
  $('#lbIn').value=l||'';$('#ozIn').value=o||(l?'0':'');fromLb()}
function saveCatch(){
  const h=$('#wHint');let sp=pick==='__new'?$('#spCustom').value.trim().replace(/\s+/g,' '):pick;
  if(!sp){h.textContent=pick==='__new'?'Впиши название нового вида':'Выбери вид рыбы в списке';h.className='msg err';if(pick==='__new')$('#spCustom').focus();return}
  const kn=speciesList().find(s=>s.toLowerCase()===sp.toLowerCase());if(kn)sp=kn;
  const g=readKg();if(!g){h.textContent='Укажи вес с экрана улова';h.className='msg err';$('#kgIn').focus();return}
  if(g>500000){h.textContent='Слишком большой вес, проверь цифры';h.className='msg err';return}
  const c={id:rid(14),pid:S.pid,sp,g,ts:Date.now(),note:$('#noteIn').value.trim().slice(0,50)};
  if(loc){c.x=+loc.x.toFixed(5);c.y=+loc.y.toFixed(5)}
  const r=recordOf(c);S.catches[c.id]=c;save();send({t:'add',c});closeSheet();render();
  toast(r==='rec'?`Рекорд комнаты: ${sp}, ${kgT(g)}`:r==='pb'?`Личный рекорд: ${sp}, ${kgT(g)}`:`Записано: ${sp}, ${kgT(g)}`,r==='rec');
}

/* ---------- share ---------- */
async function share(){
  const url=location.origin+location.pathname+'#'+S.room;
  try{if(navigator.share){await navigator.share({title:'Fish Duel',text:`Рыболовная дуэль в GTA VI. Код комнаты: ${S.room}`,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}catch(e){prompt('Скопируй ссылку:',url)}
}
